server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        # "app", docker-compose'daki PHP-FPM servisinin adı.
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Chatbot cevabı, 7B modelin tüm metni üretmesini bekliyor (streaming
        # kaldırıldı). Host'ta ~25 saniye ölçüldü; container'da GPU olmadığı
        # için daha da uzayabilir. nginx'in varsayılan 60 sn'lik timeout'u
        # yetmezdi, bu yüzden geniş tutuyoruz.
        fastcgi_read_timeout 300;
    }

    # Gizli dosyalara erişimi engelle (.env, .git vb.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
