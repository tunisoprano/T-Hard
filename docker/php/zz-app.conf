; PHP-FPM havuz ayarları — resmi imajın www.conf'unun ÜSTÜNE yazar
; (dosya adı "zz-" ile başladığı için en son okunur).
[www]

; KRİTİK: php-fpm varsayılan olarak clear_env=yes ile çalışır, yani
; container'a verilen ortam değişkenlerini (DB_HOST, RABBITMQ_HOST,
; OLLAMA_URL ...) PHP script'lerinden GİZLER. Bu satır olmadan Laravel
; docker-compose'daki ayarları göremez, bind-mount edilmiş .env dosyasındaki
; host'a ait değerlere (127.0.0.1) düşer ve hiçbir servise bağlanamaz.
clear_env = no

; Chatbot isteği, 7B modelin cevabı tamamen üretmesini bekliyor. php-fpm'in
; kendi kesme sayacını devre dışı bırakıyoruz (nginx tarafındaki
; fastcgi_read_timeout zaten üst sınırı belirliyor).
request_terminate_timeout = 0
