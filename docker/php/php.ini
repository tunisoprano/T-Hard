; T-Hard için PHP ayarları (imajın varsayılanlarını ezer)

; Semantik arama, veritabanındaki TÜM ürün embedding'lerini (400 ürün x 1024
; boyutlu vektör) PHP dizisi olarak belleğe alıp kosinüs benzerliği hesaplıyor
; — bkz. SemanticSearchService. Bu, imajın varsayılan 128M limitine yakın/üstü
; bir yük demek. Limiti yükseltiyoruz.
memory_limit = 512M

; LLM cevabı beklenirken script uzun süre ayakta kalıyor.
max_execution_time = 300

; Geliştirme kurulumu: bind-mount edilen dosyalar değiştiğinde opcache
; kendini tazelesin, yoksa kod değişiklikleri yansımaz.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
